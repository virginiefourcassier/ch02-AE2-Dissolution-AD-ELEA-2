const DATA={"intro": "<h3>La finale de la Fermat-league approche...<\/h3>\n<p><\/p>\n<h5><img src=\"assets/ac48f7e0a874.jpg\" alt=\"fermat leaugue\" width=\"823\" height=\"550\" loading=\"lazy\"><\/h5>\n<h5> <\/h5>\n<h5> <\/h5>\n<h5>Mais des problèmes surviennent...<\/h5>\n<h5> <\/h5><p>Ton équipe est en danger ! Il faut absolument l'aider.<\/p>\n<p>Pour cela tu vas devoir en apprendre plus sur la<\/p>\n<p><strong><span>Préparation d’une solution<\/span><\/strong><\/p>\n<p><strong><span>par <span>dissolution<\/span> d’un soluté solide<\/span><span>.<\/span><\/strong> <\/p>\n<p><\/p>\n<p>Mais attention ton temps est limité :<\/p>\n<p>tu vas devoir réussir <span>en moins de<\/span> <span>25 minutes<\/span>. <\/p>\n<p><br><br>Es-tu prêt à franchir toutes les épreuves ?<\/p>", "launch": "<p><img src=\"assets/6df6d4936f34.png\" alt=\"Illustration du document\" width=\"200\" height=\"300\" loading=\"lazy\"><\/p>\n<h5>Il faut sélectionner un élève de seconde passionné de chimie et de sport pour une mission spéciale : créer une boisson isotonique maison capable de redonner de l’énergie à ses camarades. Et c'est vers toi que se tournent tous les élèves du lycée pour te demander ton aide...<\/h5>\n<h4><strong>Mais seras-tu à la hauteur ? Pour le savoir, passe à l'activité suivante ...<\/strong><\/h4>", "docs_intro": "<p>Pour consulter les documents dans une nouvelle page : <a href=\"https://1drv.ms/b/c/71d6b4680dda7532/ETJ12g1otNYggHFTJgAAAAABZs8yRRH0i1g2_O90JPUHeQ?e=3LeqAz\" target=\"_blank\" rel=\"noopener noreferrer\">CLIC ICI<\/a><\/p>", "docs": "<p><strong><span><span>I.<span>    <\/span><\/span><\/span><\/strong><strong><span>Quel type de boisson pour l’effort et pourquoi ?<\/span><\/strong><\/p>\n<p><\/p>\n<p><span>Dans tous les sports d’endurance une bonne hydratation est cruciale, car une mauvaise hydratation entraîne une baisse de <\/span><span>la performance et peut, à terme, entraîner des <\/span><span>tendinites.<\/span><\/p>\n<p><span><img src=\"assets/5696f3127b0f.png\" loading=\"lazy\" alt=\"Illustration du document\"><\/span><\/p>\n<p><\/p>\n<p><\/p>\n<p><span>L’apport d’eau pure est insuffisant, la boisson doit être <span>isotonique<\/span>, de manière à favoriser son absorption par le sang.<\/span><\/p>\n<p><span><span>Pour préparer une boisson isotonique, il vous faudra de l’eau, éventuellement du thé (pour l’arôme), du sucre blanc ou roux (simple saccharose ou fructose) et, pour les efforts de longue durée, des maltodextrines<\/span><\/span><\/p>\n<p><\/p>\n<p><\/p>\n<p><\/p>\n<p><span> <\/span><\/p>\n<p><strong><span><span>II.<span>    <\/span><\/span><\/span><\/strong><strong><span>Comment préparer une boisson isotonique ?<\/span><\/strong><\/p>\n<p><strong><span><span>Ø<\/span><\/span><\/strong><strong><span> Effort de moins de 2 heures<\/span><\/strong><\/p>\n<p><span>En pratique, comptez de 30 g/L (temps chaud) à 70 g/L (temps froid) de sucre pour obtenir une boisson isotonique. Vous pourrez utiliser du sucre en morceaux ou en poudre (formule du saccharose C<sub>12<\/sub>H<sub>22<\/sub>O<sub>11<\/sub>).<\/span><\/p>\n<p><span> <\/span><\/p>\n<p><strong><span><span>Ø<\/span><\/span><\/strong><strong><span> Effort de plus de 2 heures<\/span><\/strong><\/p>\n<p><span>Pour les efforts de longue durée, les boissons constituées de sucres simples s’avèrent insuffisantes si elles ne sont pas complétées par une alimentation solide et/ou par des maltodextrines. L’utilisation des maltodextrines permet un apport supplémentaire d’énergie qui n’interviendra environ que 2 heures après absorption. Ces polymères de glucose prennent en effet un certain temps à se dégrader en glucose.<\/span><\/p>\n<p><span>Pour préparer une boisson d’effort de longue durée, versez de 30 à 40 g de maltodextrine dans 1 litre d’eau ou de thé. Ajoutez de 30 g (temps chaud) à 70 g (temps froid) de sucre (saccharose) ou de sirop. Ajoutez une pincée de sel.<\/span><\/p>", "end": "<p><strong> <img src=\"assets/6b9061354083.png\" alt=\"Illustration du document\" width=\"200\" height=\"200\" loading=\"lazy\"><br><\/strong><\/p>\n<p><strong>Bravo ! Tu as réussi ta mission !<\/strong><\/p>\n<p>Grâce à ton courage et à tes compétences, tu deviens le héros du lycée.<\/p>\n<p>Ta boisson est proposée à ton équipe avant la finale de la Fermat-league et les résultats sont spectaculaires !<\/p>\n<p>Tu reçois le badge d’« Innovateur Scientifique » et ton protocole expérimental est affiché dans toutes les salles de sport des lycées de la région.<\/p>\n<p>À bientôt pour de nouvelles aventures...<\/p>", "quizzes": [{"name": "Boisson isotonique", "seconds": 1800, "grade": 10.0, "sum": 20.0, "items": [{"page": 1, "slot": 1, "type": "gapselect", "mark": 1.0, "name": "1.a", "id": "91242", "text": "<h3><span>Pour obtenir une boisson isotonique, on dissout du sucre dans de l’eau.<\/span><\/h3>\n<h3><span>On commence par dissoudre un carré de sucre dans un litre d’eau. <\/span><\/h3>\n<h3><span>Une fois le mélange obtenu, [[2]] par la suite séparer le sucre de l’eau par décantation ou filtration.<\/span><\/h3>\n<h3><span>On qualifie alors un tel mélange de [[4]] <\/span><\/h3>", "feedback": "<h4><span>Lorsque le sucre est totalement dissout dans l’eau, le sucre n’est plus visible et ne peut plus être séparé de l’eau par filtration ou décantation. Un tel mélange, après agitation, est un <strong><span>mélange homogène<\/span><\/strong>, constitué <strong><span>d’une seule phase<\/span><\/strong>.<\/span><\/h4>", "options": ["on peut", "on ne peut pas", "mélange hétérogène", "mélange homogène"], "answers": [1, 3]}, {"page": 2, "slot": 2, "type": "match", "mark": 1.0, "name": "1.a Décantation/filtration", "id": "90609", "text": "<p>Associer<\/p>", "feedback": "", "pairs": [{"prompt": "<p><img src=\"assets/decantation-originale.png\" alt=\"La décantation - Cours de physique-chimie collège 5ᵉ -\" loading=\"lazy\"><\/p>", "answer": "décantation"}, {"prompt": "<p><img src=\"assets/filtration-originale.png\" alt=\"SchoolMouv : Cours en ligne pour le collège et le lycée\" loading=\"lazy\"><\/p>", "answer": "filtration"}], "options": ["décantation", "filtration", "distillation", "dissolution", "dilution"]}, {"page": 3, "slot": 3, "type": "gapselect", "mark": 2.0, "name": "1.b", "id": "90630", "text": "<p><span>En chimie, <\/span><\/p>\n<p><span>le sucre, (espèce chimique prise en petite quantité que l’on dissout) se nomme [[1]]<\/span><\/p>\n<p><span> <\/span><\/p>\n<p><span>l’eau (espèce chimique en quantité majoritaire avec laquelle on réalise la dissolution) se nomme [[2]]<\/span><\/p>\n<p><span> <\/span><\/p>\n<p><span>la boisson obtenue en mélangeant les deux espèces chimiques précédentes se nomme <\/span><span>[[3]]<\/span><\/p>\n<p><span> <\/span><\/p>\n<p><span> <\/span><\/p>", "feedback": "<h4><strong><span>Une <span>Solution<\/span> est un <span>mélange<\/span> <span>homogène<\/span> résultant de la <span>dissolution<\/span> <\/span><\/strong><\/h4>\n<h4><strong><span>d’une ou plusieurs espèces chimiques prises en <span>petite quantité <\/span>et<span>  <\/span>dénommée(s) <span>soluté<\/span>(s) <\/span><\/strong><\/h4>\n<h4><strong><span>dans une autre espèce chimique en quantité <span>majoritaire<\/span> et dénommée <span>solvant<\/span>.<\/span><\/strong><strong><span> <\/span><\/strong><\/h4>", "options": ["soluté", "solvant", "solution", "diluant", "concentrat"], "answers": [0, 1, 2]}, {"page": 4, "slot": 4, "type": "multichoice", "mark": 2.0, "name": "1.c", "id": "90616", "text": "<p><span>l’équation de dissolution dans l’eau du saccharose de formule C<sub>12<\/sub>H<sub>22<\/sub>O<sub>11 <\/sub>est :<\/span><\/p>\n<p><span><img src=\"assets/204a4b6e47c9.jpg\" loading=\"lazy\" alt=\"Illustration du document\"><\/span><\/p>\n<p><\/p>", "feedback": "", "options": [{"html": "<p><span><img width=\"45\" height=\"12\" loading=\"lazy\" alt=\"Illustration du document\"><\/span><img src=\"assets/414a82af41d9.png\" loading=\"lazy\" alt=\"Illustration du document\"><\/p>", "correct": false}, {"html": "<p><img src=\"assets/ac450660dac6.png\" loading=\"lazy\" alt=\"Illustration du document\"><\/p>", "correct": true}, {"html": "<p><img src=\"assets/47b6bef0876e.png\" loading=\"lazy\" alt=\"Illustration du document\"><\/p>", "correct": false}, {"html": "<p><img src=\"assets/079342f1453a.png\" loading=\"lazy\" alt=\"Illustration du document\"><\/p>", "correct": false}, {"html": "<p><img src=\"assets/80eb71c34324.png\" loading=\"lazy\" alt=\"Illustration du document\"><\/p>", "correct": false}]}, {"page": 5, "slot": 5, "type": "gapselect", "mark": 1.0, "name": "1.d", "id": "161486", "text": "<p><span>Si on continue d’ajouter des m<\/span><span>orceaux de sucre, <\/span><\/p>\n<p><span>l’eau ne peut plus <span>[[1]]<\/span> le sucre. <\/span><\/p>\n<p><span>Le mélange obtenu est <span><span>[[3]]<\/span><\/span><\/span><span>,<\/span><\/p>\n<p><span>et on peut distinguer à l’œil nu deux <span><span><span>[[5]] <\/span><\/span><\/span>: une <span><span><span><span><span>[[6]]<\/span><\/span><\/span><\/span><\/span> inférieure et une <span><span><span><span>[[7]]<\/span><\/span><\/span><\/span><\/span><span> supérieure.<\/span><\/p>\n<p><span><span>La<\/span> <\/span><span>solution<\/span><span> <span>obtenue est dite<\/span> <span><span><span><span><span>[[11]]<\/span><\/span><\/span><\/span><\/span><\/span><span>.<\/span><\/p>", "feedback": "<p><span>Si on continue d’ajouter des m<\/span><span>orceaux de sucre, <\/span><\/p>\n<p><span>l’eau ne peut plus dissoudre le sucre. <\/span><\/p>\n<p><span>Le mélange obtenu est <\/span><u><span>hétérogène<\/span><\/u><span>,<\/span><\/p>\n<p><span>et on peut distinguer à l’œil nu 2 phases: une phase solide inférieure et <\/span><span>une phase aqueuse supérieure.<\/span><\/p>\n<p><span><span>La<\/span> <\/span><span>solution<\/span><span> <span>obtenue est dite <\/span><\/span><span>saturée<\/span><span>.<\/span><\/p>", "options": ["dissoudre", "faire fondre", "hétérogène", "homogène", "phases", "phase solide", "phase aqueuse", function firstMissingAnswer(items){for(let x of items){if(x.type==='description')continue;let fields=[...$('#main').querySelectorAll(`[data-slot="${x.slot}"]`)];if(!fields.length)continue;if(fields[0].tagName==='SELECT'){let missing=fields.find(f=>f.value==='');if(missing)return missing}else if(fields[0].type==='checkbox'){if(!fields.some(f=>f.checked))return fields[0]}else if(!fields[0].value.trim())return fields[0]}return null}
function formatGrade(n){return (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function questionHTML(x,q,review){let v=q.answers[x.slot],text=x.text||'';text=text.replace(/\{V\}/g,String(q.volume||50));let inner='';
 if(x.type==='gapselect'){let n=0;text=text.replace(/\[\[(\d+)\]\]/g,()=>{let k=n++;return `<select class="inline-gap" data-slot="${x.slot}" data-pos="${k}" aria-label="Réponse ${k+1}" ${review?'disabled':''}><option value="">Choisir…</option>${x.options.map((opt,j)=>`<option value="${j}" ${Array.isArray(v)&&v[k]===j?'selected':''}>${escapeHTML(opt)}</option>`).join('')}</select>`});inner=`<div class="text">${text}</div>`}
 else if(x.type==='match'){inner=`<div class="text">${text}</div>`+x.pairs.map((pair,k)=>`<div class="item-row ${x.slot===2?'source-diagram':''}"><span class="prompt">${pair.prompt}</span><select data-slot="${x.slot}" data-pos="${k}" aria-label="Associer l’illustration ${k+1}" ${review?'disabled':''}><option value="">Choisir…</option>${x.options.map((option,j)=>`<option value="${j}" ${Array.isArray(v)&&v[k]===j?'selected':''}>${escapeHTML(option)}</option>`).join('')}</select></div>`).join('')}
 else if(x.type==='multichoice'){inner=`<div class="text">${text}</div><p>Sélectionner la ou les réponses exactes.</p>`+x.options.map((o,k)=>`<label class="answer"><input type="checkbox" data-slot="${x.slot}" value="${k}" ${Array.isArray(v)&&v.includes(k)?'checked':''} ${review?'disabled':''}><span>${o.html}</span></label>`).join('')}
 else if(x.type==='shortanswer'||x.type==='calculated'){inner=`<div class="text">${text}</div><label>Ta réponse : <input type="text" data-slot="${x.slot}" value="${escapeHTML(v||'')}" inputmode="${x.type==='calculated'?'decimal':'text'}" ${review?'disabled':''}></label>`}
 else inner=`<div class="text">${text}</div>`;
 let feedback='';if(review&&x.type!=='description'){let g=grade(x,q);let corr=correctText(x,q);feedback=`<div class="feedback ${g===x.mark?'':'bad'}"><strong>${g===x.mark?'Bonne réponse':g>0?'Réponse partiellement correcte':'À revoir'} · ${formatGrade(g)} / ${formatGrade(x.mark)} point(s)</strong>${corr?`<p>Réponse attendue : ${escapeHTML(corr)}</p>`:''}${x.feedback?`<div>${x.feedback}</div>`:''}</div>`}
 return `<section class="question"><h3>${x.type==='description'?'Ressource':`Question ${x.slot} · ${formatGrade(x.mark)} point(s)`}</h3>${inner}${feedback}</section>`}
function storeInputs(i){let q=quizState(i);if(q.submitted)return;let all=[...$('#main').querySelectorAll('[data-slot]')];let slots=new Set(all.map(x=>Number(x.dataset.slot)));for(let slot of slots){let fields=all.filter(x=>Number(x.dataset.slot)===slot);if(fields[0].tagName==='SELECT'){q.answers[slot]=fields.map(f=>f.value===''?null:Number(f.value))}else if(fields[0].type==='checkbox'){q.answers[slot]=fields.filter(f=>f.checked).map(f=>Number(f.value))}else{q.answers[slot]=fields[0].value}}save()}
function normal(s){return String(s||'').toLocaleLowerCase('fr').replace(/\s+/g,'').replace(/[×·*]/g,'*').replace(/,/g,'.').trim()}
function numerical(s){let v=normal(s).replace(/g$/,'').replace(/\*10\^?1$/,'*10');if(/^[-+]?\d+(\.\d+)?(e[-+]?\d+)?$/.test(v))return Number(v);let m=v.match(/^([-+]?\d+(?:\.\d+)?)(?:\*|\.)10(?:\^?([-+]?\d+))?$/);return m?Number(m[1])*10**Number(m[2]||1):NaN}
function grade(x,q){let v=q.answers[x.slot];if(x.type==='description')return 0;if(x.type==='gapselect'){if(!Array.isArray(v))return 0;return x.mark*x.answers.filter((a,k)=>v[k]===a).length/x.answers.length}
 if(x.type==='match'){if(!Array.isArray(v))return 0;return x.mark*x.pairs.filter((p,k)=>x.options[v[k]]===p.answer).length/x.pairs.length}
 if(x.type==='multichoice'){let selected=Array.isArray(v)?v:[];return x.mark*Number(x.options.every((opt,k)=>selected.includes(k)===!!opt.correct))}
 if(x.type==='shortanswer')return x.mark*Number(x.answers.some(a=>normal(a)===normal(v)||numerical(a)===numerical(v)));
 if(x.type==='calculated'){let n=numerical(v),expected=30*(q.volume||50)/1000;return x.mark*Number(Number.isFinite(n)&&Math.abs(n-expected)<=x.tolerance*expected+1e-10)}return 0}
function correctText(x,q){if(x.type==='gapselect')return x.answers.map(j=>x.options[j]).join(' · ');if(x.type==='match')return x.pairs.map((p,k)=>`${k+1}. ${p.answer}`).join(' · ');if(x.type==='multichoice')return x.options.map((o,i)=>o.correct?String(i+1):null).filter(Boolean).join(', ')+' (proposition)';if(x.type==='shortanswer')return x.answers[0];if(x.type==='calculated')return `${(30*(q.volume||50)/1000).toLocaleString('fr-FR')} g`;return ''}
function finish(i,timeout){let q=quizState(i);if(q.submitted)return;let z=DATA.quizzes[i],points=z.items.reduce((s,x)=>s+grade(x,q),0);q.result=10*points/z.sum;q.submitted=true;q.timeout=timeout;q.deadline=0;state.completed[i+3]=true;save();render()}
render();
</script></body></html>
